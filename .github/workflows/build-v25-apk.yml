name: Build N2Memory V25 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/source_parts/**'
      - '.github/workflows/build-v25-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore and verify V25 source
        shell: bash
        run: |
          cat ci/source_parts/source.zip.part-* > /tmp/N2Memory_Android_V25_source.zip
          echo "1e1e26553bf2d7469c9bbecf73bc4e0994d397a8814910f64855b1a6f03fc0f9  /tmp/N2Memory_Android_V25_source.zip" | sha256sum -c -
          mkdir source
          unzip -q /tmp/N2Memory_Android_V25_source.zip -d source
      - name: Run V25 regression tests
        working-directory: source
        run: |
          python3 tests/host/run_tests.py
          python3 tests/test_offline_master.py
          python3 tests/test_v23_learning_cards.py
          python3 tests/test_v24_exam_training.py
          python3 tests/test_v25_notebook_audio.py
      - name: Build and verify signed APK
        working-directory: source
        run: python3 scripts/build_sdk.py
      - name: Collect APK
        run: |
          mkdir apk
          cp source/build/direct-sdk/N2Memory_Android_0.25.0_test.apk apk/N2Memory_Android_V25_test.apk
          sha256sum apk/N2Memory_Android_V25_test.apk | tee apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N2Memory-Android-V25-APK
          path: apk/
          if-no-files-found: error
          retention-days: 30
